<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Bites - Canteen Kiosk Menu Board</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: '#0B0C0E',
            charcoal: '#14151B',
            cardElevated: '#1D1F28',
            borderDark: '#2C2E3C',
            crimson: {
              DEFAULT: '#E50914',
              hover: '#B81D24',
              light: '#FF3B30',
            },
            accentGold: '#FFB800',
            successGreen: '#00E676',
            vegGreen: '#2E7D32',
            nonVegRed: '#D32F2F',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0B0C0E;
      color: #FFFFFF;
      font-family: '"Plus Jakarta Sans"', sans-serif;
      overflow: hidden;
      user-select: none;
    }
    @keyframes kenburns {
      0% { transform: scale(1.0); }
      50% { transform: scale(1.06); }
      100% { transform: scale(1.0); }
    }
    .ken-burns {
      animation: kenburns 20s infinite ease-in-out;
    }
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .animate-marquee {
      display: inline-block;
      white-space: nowrap;
      animation: marquee 30s linear infinite;
    }
    /* Hide scrollbar */
    ::-webkit-scrollbar { display: none; }
    * { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-obsidian text-white h-screen w-screen flex flex-col justify-between selection:bg-crimson selection:text-white">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const API_BASE = window.location.origin.includes('8080')
      ? '/api'
      : 'http://localhost:8080/api';

    function KioskApp() {
      const [dishes, setDishes] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(true);
      const [intervalSec, setIntervalSec] = useState(5);
      const [progress, setProgress] = useState(0);
      const [currentTime, setCurrentTime] = useState(new Date());
      const [loading, setLoading] = useState(true);
      const [isFullscreen, setIsFullscreen] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState('ALL');

      // Fetch Menu (available dishes only)
      const fetchDishes = async () => {
        try {
          const res = await fetch(`${API_BASE}/menu`);
          if (res.ok) {
            const data = await res.json();
            // Filter strictly available items
            const available = data.filter(item => item.is_available === true);
            setDishes(available);
            setLoading(false);
          }
        } catch (e) {
          console.error("Failed to load kiosk menu:", e);
        }
      };

      // Initial Fetch & 10s Background Sync
      useEffect(() => {
        fetchDishes();
        const syncInterval = setInterval(fetchDishes, 10000);
        return () => clearInterval(syncInterval);
      }, []);

      // Digital Clock Interval (every 1s)
      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      // Slideshow Auto-advance Timer & Progress Bar
      useEffect(() => {
        if (!isPlaying || dishes.length === 0) return;

        const tickRate = 50; // ms
        const totalTicks = (intervalSec * 1000) / tickRate;
        let currentTicks = 0;

        const timer = setInterval(() => {
          currentTicks++;
          setProgress(Math.min((currentTicks / totalTicks) * 100, 100));

          if (currentTicks >= totalTicks) {
            currentTicks = 0;
            setProgress(0);
            setCurrentIndex(prev => (prev + 1) % dishes.length);
          }
        }, tickRate);

        return () => clearInterval(timer);
      }, [isPlaying, dishes.length, intervalSec, currentIndex]);

      // Keyboard Controls (Arrows, Space, F)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowRight') {
            setCurrentIndex(prev => (prev + 1) % dishes.length);
            setProgress(0);
          } else if (e.key === 'ArrowLeft') {
            setCurrentIndex(prev => (prev - 1 + dishes.length) % dishes.length);
            setProgress(0);
          } else if (e.key === ' ') {
            setIsPlaying(prev => !prev);
          } else if (e.key.toLowerCase() === 'f') {
            toggleFullscreen();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [dishes.length]);

      const toggleFullscreen = () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().then(() => setIsFullscreen(true)).catch(() => {});
        } else {
          document.exitFullscreen().then(() => setIsFullscreen(false)).catch(() => {});
        }
      };

      const currentDish = dishes[currentIndex] || null;

      // Filtered side-list
      const filteredDishes = useMemo(() => {
        if (selectedCategory === 'ALL') return dishes;
        return dishes.filter(d => d.category.toLowerCase() === selectedCategory.toLowerCase());
      }, [dishes, selectedCategory]);

      if (loading) {
        return (
          <div className="flex flex-col items-center justify-center h-full bg-obsidian">
            <div className="text-6xl animate-bounce mb-4">🍔</div>
            <h2 className="text-2xl font-black tracking-wider text-white">CAMPUS BITES KIOSK</h2>
            <p className="text-gray-400 mt-2 text-sm">Connecting to live canteen database...</p>
          </div>
        );
      }

      if (dishes.length === 0) {
        return (
          <div className="flex flex-col items-center justify-center h-full bg-obsidian p-8 text-center">
            <div className="text-6xl mb-4">🍽️</div>
            <h2 className="text-2xl font-black text-white">Canteen Counter Closed</h2>
            <p className="text-gray-400 mt-2 text-base">All items are currently being prepared or out of stock.</p>
          </div>
        );
      }

      return (
        <div className="h-full w-full flex flex-col justify-between p-6 lg:p-8 bg-obsidian">
          {/* Top Header Bar */}
          <header className="flex items-center justify-between pb-5 border-b border-borderDark/80 shrink-0">
            {/* Brand Logo & Station Title */}
            <div className="flex items-center gap-4">
              <div className="w-12 h-12 rounded-2xl bg-crimson flex items-center justify-center shadow-lg shadow-crimson/40">
                <span className="text-2xl">🍔</span>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="text-2xl font-black tracking-tight">CAMPUS</span>
                  <span className="text-2xl font-black text-crimson tracking-tight">BITES</span>
                  <span className="ml-2 text-xs font-bold uppercase tracking-widest px-2.5 py-0.5 rounded-full bg-cardElevated border border-borderDark text-gray-300">
                    Live Menu Board
                  </span>
                </div>
                <div className="text-xs text-gray-400 font-medium mt-0.5 flex items-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-successGreen animate-pulse"></span>
                  <span>Kitchen Counters 1 & 2 Open</span>
                  <span>•</span>
                  <span>{dishes.length} Dishes Ready To Order</span>
                </div>
              </div>
            </div>

            {/* Live Clock & Action Controls */}
            <div className="flex items-center gap-6">
              <div className="text-right">
                <div className="text-2xl font-black font-mono text-white tracking-wider">
                  {currentTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}
                </div>
                <div className="text-xs font-semibold text-gray-400 uppercase tracking-wider">
                  {currentTime.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}
                </div>
              </div>

              {/* Fullscreen & Pause Control */}
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setIsPlaying(!isPlaying)}
                  title={isPlaying ? 'Pause Slideshow' : 'Resume Slideshow'}
                  className="w-10 h-10 rounded-xl bg-cardElevated hover:bg-borderDark border border-borderDark flex items-center justify-center text-sm font-bold transition shadow"
                >
                  {isPlaying ? '⏸' : '▶'}
                </button>
                <button
                  onClick={toggleFullscreen}
                  title="Toggle Fullscreen Kiosk Mode (F11)"
                  className="w-10 h-10 rounded-xl bg-cardElevated hover:bg-borderDark border border-borderDark flex items-center justify-center text-sm font-bold transition shadow"
                >
                  ⛶
                </button>
              </div>
            </div>
          </header>

          {/* Main Showcase Section */}
          <main className="flex-1 my-6 grid grid-cols-1 lg:grid-cols-12 gap-8 items-stretch overflow-hidden">
            {/* Left 7 Columns: Featured Dish Hero Slide */}
            <div className="lg:col-span-8 bg-charcoal border border-borderDark rounded-3xl overflow-hidden shadow-2xl flex flex-col justify-between relative group">
              {/* Background Dish Image with Ken Burns effect */}
              <div className="relative w-full h-full min-h-[420px] flex-1 overflow-hidden">
                <img
                  key={currentDish.id}
                  src={currentDish.image_url}
                  alt={currentDish.name}
                  className="w-full h-full object-cover ken-burns"
                  onError={(e) => {
                    e.target.src = 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=1200';
                  }}
                />

                {/* Smooth Dark Gradient Overlays */}
                <div className="absolute inset-0 bg-gradient-to-t from-charcoal via-charcoal/40 to-transparent"></div>
                <div className="absolute inset-0 bg-gradient-to-r from-charcoal/90 via-transparent to-transparent"></div>

                {/* Top Floating Badge Pills */}
                <div className="absolute top-6 left-6 flex flex-wrap items-center gap-3">
                  {/* Veg / Non-Veg Indicator */}
                  <div className="px-3.5 py-1.5 rounded-xl bg-obsidian/85 backdrop-blur border border-borderDark flex items-center gap-2">
                    <span className={`w-3 h-3 rounded-full ${currentDish.is_veg ? 'bg-vegGreen ring-4 ring-vegGreen/20' : 'bg-nonVegRed ring-4 ring-nonVegRed/20'}`}></span>
                    <span className={`text-xs font-black uppercase tracking-wider ${currentDish.is_veg ? 'text-emerald-400' : 'text-red-400'}`}>
                      {currentDish.is_veg ? 'Pure Veg' : 'Non-Veg'}
                    </span>
                  </div>

                  {/* Category Pill */}
                  <div className="px-3.5 py-1.5 rounded-xl bg-crimson text-white text-xs font-black uppercase tracking-wider shadow-lg shadow-crimson/30">
                    {currentDish.category}
                  </div>

                  {/* Prep Time & Calories */}
                  <div className="px-3.5 py-1.5 rounded-xl bg-obsidian/85 backdrop-blur border border-borderDark text-xs font-bold text-gray-300 flex items-center gap-3">
                    <span>⏱️ {currentDish.prep_time_minutes} mins</span>
                    <span>•</span>
                    <span>🔥 {currentDish.calories} kcal</span>
                    <span>•</span>
                    <span className="text-accentGold font-black">⭐ {currentDish.rating}</span>
                  </div>
                </div>

                {/* Left/Right Click Nav Arrows */}
                <button
                  onClick={() => {
                    setCurrentIndex(prev => (prev - 1 + dishes.length) % dishes.length);
                    setProgress(0);
                  }}
                  className="absolute left-4 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-obsidian/60 hover:bg-crimson text-white backdrop-blur border border-borderDark flex items-center justify-center text-xl transition opacity-0 group-hover:opacity-100"
                >
                  ‹
                </button>
                <button
                  onClick={() => {
                    setCurrentIndex(prev => (prev + 1) % dishes.length);
                    setProgress(0);
                  }}
                  className="absolute right-4 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-obsidian/60 hover:bg-crimson text-white backdrop-blur border border-borderDark flex items-center justify-center text-xl transition opacity-0 group-hover:opacity-100"
                >
                  ›
                </button>

                {/* Bottom Featured Dish Card Info */}
                <div className="absolute bottom-6 left-6 right-6 flex flex-col md:flex-row md:items-end justify-between gap-6">
                  <div className="max-w-2xl">
                    <span className="text-xs font-bold uppercase tracking-widest text-crimson-light mb-1 block">
                      Dish #{currentIndex + 1} of {dishes.length} Available Today
                    </span>
                    <h2 className="text-3xl md:text-5xl font-black text-white tracking-tight drop-shadow-md">
                      {currentDish.name}
                    </h2>
                    <p className="text-sm md:text-base text-gray-300 mt-2 line-clamp-2 drop-shadow leading-relaxed">
                      {currentDish.description}
                    </p>
                  </div>

                  {/* Gigantic Price Tag */}
                  <div className="shrink-0 bg-obsidian/90 backdrop-blur-md border-2 border-accentGold/60 px-6 py-4 rounded-3xl shadow-2xl flex flex-col items-center justify-center text-center">
                    <span className="text-[11px] font-black uppercase tracking-wider text-accentGold">
                      Canteen Price
                    </span>
                    <div className="text-4xl md:text-5xl font-black font-mono text-white mt-0.5">
                      ₹{currentDish.price}
                    </div>
                    <span className="text-[10px] font-semibold text-gray-400 mt-0.5">
                      + 5% GST & Packaging
                    </span>
                  </div>
                </div>
              </div>
            </div>

            {/* Right 4 Columns: Live Price Board & All Dishes at a glance */}
            <div className="lg:col-span-4 bg-charcoal border border-borderDark rounded-3xl p-5 shadow-2xl flex flex-col justify-between overflow-hidden">
              <div>
                <div className="flex items-center justify-between pb-3 border-b border-borderDark">
                  <h3 className="font-extrabold text-sm uppercase tracking-wider text-white flex items-center gap-2">
                    <span>📋</span> Complete Price List
                  </h3>
                  <span className="text-xs font-mono font-bold text-accentGold">
                    {filteredDishes.length} Items
                  </span>
                </div>

                {/* Category Pills */}
                <div className="flex gap-1.5 my-3 overflow-x-auto pb-1 text-[11px] font-bold">
                  {['ALL', 'Breakfast', 'Lunch', 'Snacks', 'Beverages', 'Desserts'].map(cat => (
                    <button
                      key={cat}
                      onClick={() => setSelectedCategory(cat)}
                      className={`px-2.5 py-1 rounded-lg transition shrink-0 ${
                        selectedCategory === cat
                          ? 'bg-crimson text-white font-extrabold'
                          : 'bg-cardElevated text-gray-400 hover:text-white border border-borderDark'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>

                {/* Scrollable Mini Dish List */}
                <div className="space-y-2 max-h-[380px] overflow-y-auto pr-1">
                  {filteredDishes.map((item, idx) => {
                    const isSelected = item.id === currentDish.id;
                    return (
                      <div
                        key={item.id}
                        onClick={() => {
                          const realIdx = dishes.findIndex(d => d.id === item.id);
                          if (realIdx >= 0) {
                            setCurrentIndex(realIdx);
                            setProgress(0);
                          }
                        }}
                        className={`flex items-center justify-between p-2.5 rounded-xl border transition cursor-pointer ${
                          isSelected
                            ? 'bg-crimson/15 border-crimson shadow-md shadow-crimson/10'
                            : 'bg-cardElevated/70 border-borderDark hover:bg-cardElevated'
                        }`}
                      >
                        <div className="flex items-center gap-2.5">
                          <img
                            src={item.image_url}
                            alt={item.name}
                            className="w-10 h-10 rounded-lg object-cover bg-borderDark shrink-0"
                            onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=100'; }}
                          />
                          <div>
                            <div className="flex items-center gap-1.5">
                              <span className={`w-2 h-2 rounded-full shrink-0 ${item.is_veg ? 'bg-vegGreen' : 'bg-nonVegRed'}`}></span>
                              <span className={`text-xs font-bold line-clamp-1 ${isSelected ? 'text-white' : 'text-gray-200'}`}>
                                {item.name}
                              </span>
                            </div>
                            <span className="text-[10px] text-gray-400 uppercase font-semibold">
                              {item.category} • ⏱️ {item.prep_time_minutes}m
                            </span>
                          </div>
                        </div>

                        <div className="text-right shrink-0 font-mono font-black text-sm text-accentGold">
                          ₹{item.price}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Order via Mobile Hint Box */}
              <div className="mt-4 p-3.5 bg-cardElevated border border-borderDark rounded-2xl flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-accentGold/10 border border-accentGold/30 flex items-center justify-center text-accentGold text-lg shrink-0">
                  📱
                </div>
                <div className="text-xs">
                  <div className="font-extrabold text-white">Order Ahead on Mobile App!</div>
                  <div className="text-gray-400 text-[11px] mt-0.5">Skip counter lines & pick up with Token #{currentDish?.id}</div>
                </div>
              </div>
            </div>
          </main>

          {/* Bottom Bar: Slide Progress & Kiosk Announcement Marquee */}
          <footer className="pt-3 border-t border-borderDark/80 shrink-0 space-y-3">
            {/* Slide Countdown Progress Bar */}
            <div className="w-full h-1.5 bg-cardElevated rounded-full overflow-hidden">
              <div
                className="h-full bg-gradient-to-r from-crimson to-accentGold transition-all duration-75"
                style={{ width: `${progress}%` }}
              ></div>
            </div>

            <div className="flex items-center justify-between gap-4 text-xs">
              {/* Marquee Ticker */}
              <div className="flex-1 overflow-hidden relative bg-charcoal/60 border border-borderDark/80 rounded-xl py-2 px-4">
                <div className="animate-marquee font-bold text-gray-300 space-x-8">
                  <span>🍔 Welcome to Campus Bites College Canteen!</span>
                  <span>⚡ Showing all live available dishes and current pricing</span>
                  <span>🎟️ Pickup Tokens are called at Counter 1 & 2</span>
                  <span>💳 Student Meal Cards & UPI Accepted</span>
                  <span>🔥 Use Promo Code CANTEEN20 on Mobile for 15% OFF</span>
                  <span>🕒 Breakfast: 8AM-11AM | Lunch: 12PM-3:30PM | Evening: 4PM-7:30PM</span>
                </div>
              </div>

              {/* Slide Interval Selector */}
              <div className="flex items-center gap-2 text-gray-400 text-xs shrink-0">
                <span className="font-medium">Slide speed:</span>
                {[3, 5, 8].map(sec => (
                  <button
                    key={sec}
                    onClick={() => {
                      setIntervalSec(sec);
                      setProgress(0);
                    }}
                    className={`px-2 py-1 rounded-lg font-mono font-bold text-xs ${
                      intervalSec === sec ? 'bg-crimson text-white' : 'bg-cardElevated text-gray-400 hover:text-white'
                    }`}
                  >
                    {sec}s
                  </button>
                ))}
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<KioskApp />);
  </script>
</body>
</html>
